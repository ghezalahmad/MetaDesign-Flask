<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}SLAMD{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="header">
        <nav class="navbar container">
            <a href="/" class="logo">SLAMD</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/scenario">Scenario</a></li>
                <li><a href="/design-space">Design Space</a></li>
                <li><a href="/dashboard">Material Discovery</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 SLAMD Project. All Rights Reserved.</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
