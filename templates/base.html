<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}MetaDesign App{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Global Theme CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    {% block head %}{% endblock %}
</head>

<body>
    <header class="header">
        <nav class="navbar container">
            <a href="/" class="logo">MetaDesign App</a>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/scenario">Scenario</a></li>
                <li><a href="/design-space">Design Space</a></li>
                <li><a href="/dashboard">Material Discovery</a></li>
                <li><a href="/results">Results</a></li>
            </ul>
        </nav>
    </header>

    {% block content %}{% endblock %}

    <footer class="footer">
        <div class="container">
            <p>&copy; 2025 MetaDesign App Project. All Rights Reserved.</p>
        </div>
    </footer>

    <!-- ✅ Removed the old Plotly v1.x include -->
    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    {% block scripts %}{% endblock %}
</body>

</html>
