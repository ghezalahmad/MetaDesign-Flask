<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SLAMD Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">SLAMD Dashboard</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Design Assistant</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Base</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Blend</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Formulations</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Discovery</a></li>
                </ul>
            </div>
            <div class="d-flex">
                <button class="btn btn-outline-light me-2" type="button">Download</button>
                <button class="btn btn-outline-light me-2" type="button">Upload</button>
                <button class="btn btn-outline-light me-2" type="button">Delete</button>
                <button class="btn btn-outline-light" type="button">Help</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">CSV File Upload</h5>
                <div class="input-group mb-3">
                    <input type="file" class="form-control" id="csv-upload">
                    <button class="btn btn-success" type="button" id="upload-button">Upload dataset</button>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">All datasets</h5>
                <table class="table">
                    <thead>
                        <tr>
                            <th>Actions</th>
                            <th>Name</th>
                            <th>Columns</th>
                        </tr>
                    </thead>
                    <tbody id="dataset-table-body">
                    </tbody>
                </table>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <h5 class="card-title">Materials Data (Input)</h5>
                <div class="row">
                    <div class="col-md-4">
                        <select multiple class="form-control" id="input-columns" size="8"></select>
                    </div>
                    <div class="col-md-4">
                        <h5 class="card-title">Target Properties</h5>
                        <select multiple class="form-control" id="target-columns" size="8"></select>
                    </div>
                    <div class="col-md-4">
                        <h5 class="card-title">A priori Information (optional)</h5>
                        <select multiple class="form-control" id="apriori-columns" size="8"></select>
                    </div>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-body">
                <div class="row">
                    <div class="col-md-6">
                        <label for="model-select" class="form-label">Select Model *</label>
                        <select class="form-select" id="model-select">
                            <option value="lolopy">lolo Random Forest (AI model)</option>
                            <option value="maml">MAML</option>
                            <option value="reptile">Reptile</option>
                            <option value="protonet">ProtoNet</option>
                            <option value="rf">Random Forest</option>
                            <option value="pinn">PINN</option>
                            <option value="ensemble">Ensemble</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="curiosity-slider" class="form-label">Curiosity (to control the weight of model uncertainty on predicted utility) *</label>
                        <input type="range" class="form-range" min="-2" max="2" step="0.1" id="curiosity-slider" value="0.0">
                        <div class="d-flex justify-content-between">
                            <span>Exploit</span>
                            <span id="curiosity-value">0.0</span>
                            <span>Explore</span>
                        </div>
                    </div>
                </div>
                <div class="text-center mt-4">
                    <button class="btn btn-primary" id="run-experiment-button">Run experiment with given configuration</button>
                </div>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">t-SNE Visualization</h5>
                        <div id="tsne-plot"></div>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Scatter Plot</h5>
                        <div id="scatter-plot"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
